name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest -m "not live" -q
      - run: mkdir -p data
      - run: uv run alembic upgrade head
