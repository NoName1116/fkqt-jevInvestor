[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fkqt-jevinvestor"
version = "0.1.0"
description = "Independent A-share Jev and LLM signal research system"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyarrow>=17,<24",
  "sqlalchemy[asyncio]>=2.0,<3",
  "typesafe-sdk==0.7.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
fkqt-jevinvestor = "fkqt_jevinvestor.cli.main:main"

[project.optional-dependencies]
dev = [
  "pyright>=1.1,<2",
  "pyarrow-stubs==20.0.0.20260819",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fkqt_jevinvestor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires external credentials and network access"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
